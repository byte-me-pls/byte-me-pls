<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 142" width="640" height="142" role="img" aria-label="byte-me-pls, written as the eleven bytes of its letters">
<style>
.one{fill:#1f2328;transform-box:fill-box;transform-origin:50% 100%;animation:write 16.0s cubic-bezier(.2,.8,.2,1) infinite backwards}
.zero{fill:#656d76;opacity:.7}
.ch{font:600 15px ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#1f2328;text-anchor:middle;animation:show 16.0s ease infinite backwards}
.hex{font:8.5px ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#656d76;text-anchor:middle;letter-spacing:.5px;animation:show 16.0s ease infinite backwards}
.head{fill:#bc4c00;opacity:0;animation:read 16.0s linear infinite}
.say{font:13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#656d76;text-anchor:middle;opacity:0;animation:say 16.0s ease infinite}
@keyframes write{0%{transform:scaleY(.1);opacity:.45}1.6%{transform:scaleY(1);opacity:1}96%{transform:scaleY(1);opacity:1}98%,100%{transform:scaleY(.1);opacity:.45}}
@keyframes show{0%{opacity:0}2%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
@keyframes read{0%{transform:translateX(0);opacity:0}1%{opacity:1}24%{opacity:1}25%,100%{transform:translateX(565.9px);opacity:0}}
@keyframes say{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.one,.ch,.hex{animation:none}.head{display:none}.say{animation:none}.say.first{opacity:1}}
</style>
